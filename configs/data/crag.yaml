# CRAG（Meta, NeurIPS 2024 D&B）：4409 道题，每题自带一组 mock web pages。
# 关键点：语料不是全局大库，而是"题目配套页集"，所以建索引是"每题一小库"或"全题合一个大库"两种做法，
# 后者更省事且不影响指标口径，本目录默认后者。

name: crag
raw_dir: data/raw/crag          # 原始 jsonl 放这里，只读，不要手改
processed_dir: data/processed/crag
index_dir: data/index/crag

# 三段划分：按 qid 哈希，保证任何人任何时候跑出来的切分完全一致（不能随机重切）
# dev 用来拟合法定参数（权重、温度），cal 用来定阈值 τ，test 只用来报最终指标
splits:
  dev: 0.2
  cal: 0.3
  test: 0.5
  seed: 2027

# 切块：约 384 token / 重叠 64 token。中文 1 token ≈ 1.5 字，故按字符控制
chunk:
  max_chars: 800
  overlap_chars: 150
  min_chars: 80

# 检索
retrieval:
  method: bm25                  # bm25 | dense | hybrid（后两者需要 GPU 或 API）
  top_k: 20                     # 第一阶段召回
  rerank_top_n: 5               # 送进 prompt 的页数
  bm25:
    k1: 1.5
    b: 0.75
